<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="./../css/client.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=SF+Pro:wght@400;500;600;700&display=swap">
    <script src="./../JS/client.js" defer></script>
</head>

<body>

    <div class="ecran-tudiant">

        <main class="client-container">

            <!-- Fond blanc -->
            <div class="ecran-tudiant-child"></div>

            <!-- En-tête -->
            <header class="header">
                <h1 class="client">Client</h1>
            </header>

            <!-- Tableau des services -->
            <section class="notes">

                <div class="notes-header">
                    <div>Services</div>
                    <div>Prestataire</div>
                    <div>Note</div>
                    <div>Commentaire</div>
                    <div></div>
                </div>

                <!-- Les services seront ajoutés automatiquement par client.js -->

            </section>


            <!-- Déconnexion -->
            <button class="logout-button" id="logoutButton" type="button">
                <span class="logout-icon">↪</span>
                <span>Se déconnecter</span>
            </button>

        </main>

    </div>

</body>

</html>
