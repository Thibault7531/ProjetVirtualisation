<!DOCTYPE html>

<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">


    <link rel="stylesheet" href="../css/index.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=SF+Pro:wght@400;500;600&display=swap">
    <script src="../js/index.js" defer></script>


</head>

<body>


    <div class="ecran-connexion">

        <div class="connexion-container">

            <div class="ecran-connexion-child"></div>

            <div class="connexion">Connexion</div>

            <div class="text-fields">

                <!-- Identifiant -->
                <div class="input-container">
                    <input type="text" id="identifiant" class="input-field" placeholder="Identifiant"
                        autocomplete="username">
                </div>

                <!-- Mot de passe -->
                <div class="input-container">
                    <input type="password" id="motDePasse" class="input-field" placeholder="Mot de passe"
                        autocomplete="current-password">
                </div>

            </div>

            <!-- Message d'erreur -->
            <div id="erreur-connexion" class="erreur-connexion">
                Identifiant ou mot de passe incorrect.
            </div>

            <div class="buttons">

                <!-- Bouton Se connecter -->
                <div class="button-liquid-glass-text" id="buttonLiquidGlassText">
                    <div class="bg">
                        <div class="fill-shadow"></div>
                        <div class="white-backing"></div>
                        <div class="tint"></div>
                        <div class="glass-effect"></div>
                    </div>

                    <div class="text">
                        <div class="symbol">Se connecter</div>
                    </div>
                </div>

                <!-- Bouton Inscription -->
                <div class="button-liquid-glass-text2" id="buttonLiquidGlassText1">
                    <div class="bg">
                        <div class="fill-shadow2"></div>
                        <div class="glass-effect"></div>
                    </div>

                    <div class="text">
                        <div class="symbol2">Inscription</div>
                    </div>
                </div>

            </div>

        </div>

    </div>

</body>

</html>
