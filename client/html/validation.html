<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="../css/validation.css">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=SF+Pro:wght@400;500;600;700&display=swap">
    <script src="../js/validation.js" defer></script>
</head>

<body>

    <div class="ecran-validation">

        <main class="validation-container">

            <div class="ecran-validation-child"></div>


            <!-- TITRE -->

            <header class="header">
                <h1 class="validation-titre">
                    Validation comptes utilisateurs
                </h1>
            </header>


            <!-- COMPTES EN ATTENTE -->

            <section class="section-comptes">

                <h2 class="section-titre">
                    Comptes en attente
                </h2>

                <div class="comptes">

                    <div class="comptes-header">
                        <div>Utilisateur</div>
                        <div>Email</div>
                        <div>Type</div>
                        <div>Actions</div>
                    </div>

                    <div class="liste-comptes" id="listeAttente">
                    </div>

                </div>

            </section>


            <!-- COMPTES VALIDÉS -->

            <section class="section-comptes">

                <h2 class="section-titre">
                    Comptes validés
                </h2>

                <div class="comptes">

                    <div class="comptes-header">
                        <div>Utilisateur</div>
                        <div>Email</div>
                        <div>Type</div>
                        <div>Actions</div>
                    </div>

                    <div class="liste-comptes" id="listeValides">
                    </div>

                </div>

            </section>


            <!-- DÉCONNEXION -->

            <button class="logout-button" id="logoutButton" type="button">

                <span class="logout-icon">↪</span>
                <span>Se déconnecter</span>

            </button>

        </main>

    </div>

</body>

</html>
